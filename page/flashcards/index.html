<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>Study Mandarin: Flashcards</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../src/img/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../src/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../src/img/favicon-16x16.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../src/base.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.40/jquery.csv.min.js"></script>
  </head>
  <body>
    <div id="header">
      <a id="home-link">Home</a>
      <a onclick="flashcardPage.changeFlashcardSet()">Change Set</a>
      <a onclick="flashcardPage.reset()" style="color: #666">Reset Progress</a>
    </div>
    <div id="modal">
      <p>Curated</p>
      <ul>
        <li>Coming soon</li>
      </ul>
      <p>Sourced</p>
      <ul>
        <li>
          <a onclick="flashcardPage.chooseSet('basic')">Basic</a>
        </li>
        <li>
          <a onclick="flashcardPage.chooseSet('reddit')">Reddit</a>
        </li>
      </ul>
    </div>
    <div id="container">
      <div id="count"></div>
      <div id="hanzi"></div>
      <div id="pinyin"></div>
      <div id="english"></div>
    </div>
    <div id="actions" class="no-select">
      <div class="action">
        <a id="known-button" onclick="flashcardPage.markAsKnown()" style="color: #999"
          >Known</a
        >
      </div>
      <div class="action">
        <a id="reveal-or-next-button" onclick="flashcardPage.revealOrNext()">Reveal</a>
      </div>
      <div class="action">
        <a id="google-translate" target="_blank" style="color: #999"
          >Translate</a
        >
      </div>
    </div>
  </body>
  <script src="../../src/lib/papaparse.min.js"></script>
  <script src="../../src/util.js"></script>
  <script src="flashcard.js"></script>
  <script>
    const flashcardPage = new FlashcardPage();
  </script>
</html>
