<html>
  <head></head>
  <body>
    <script>
      function getIsMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent
        );
      }

      function getDeviceOS() {
        if (/Android/.test(navigator.userAgent)) {
          return "android";
        } else if (/iPhone|iPhase|iPod/.test(navigator.userAgent)) {
          return "ios";
        }
        return "unknown";
      }

      function attemptRedirectToApp() {}

      function redirectToWebpage() {}

      // https://gist.github.com/pjflanagan/5dd6889dc791ce4c318e7dded58589a5

      (function () {
        // TODO: get all the URL params, if there are errors, do nothing
        const urlParams = new URLSearchParams(window.location.search);
        const androidURL = urlParams.get("android");
        const iosURL = urlParams.get("ios");
        const webURL = urlParams.get("web");

        // 1) if this is not a mobile device, redirect to the webpage
        if (!getIsMobile()) {
          window.location.replace(webURL, "_blank");
          return;
        }

        // 2) get the OS, if unknown redirect to page, otherwise determine which url to use
        const os = getDeviceOS();
        let appUrl = "";
        switch (os) {
          case "ios":
            appUrl = iosURL;
            return;
          case "android":
            appUrl = androidURL;
            return;
          case "unknown":
          default:
            window.location.replace(webURL);
            return;
        }

        // 3) attempt to open the app, this will create a popup, add a listener for if the page is refocused to open the webpage instead
        window.location.replace(appUrl);
        window.addEventListener("focus", () => {
          window.location.replace(webURL, "_blank");
        });
      })();
    </script>
  </body>
</html>
