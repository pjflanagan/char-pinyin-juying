<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mandarin Pronunciation Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.40/jquery.csv.min.js"></script>
  </head>
  <body onclick="focusInputEnd(event);">
    <div id="display-characters">
      <!-- TODO: character template -->
      <div class="character" data-index="0">
        <div class="hitbox-holder">
          <div class="hitbox" data-hitbox="left" onclick="focusInputAt(event);"></div>
          <div class="hitbox" data-hitbox="right" onclick="focusInputAt(event);"></div>
        </div>
        <div class="hanzi no-pointer">我</div>
        <div class="pinyin no-pointer">wǒ</div>
        <div class="zhuyin-holder no-pointer">
          <div class="zhuyin">
            ㄨㄛ
            <div class="tone">ˇ</div>
          </div>
        </div>
      </div>
      <div id="cursor"></div>
      <input id="hidden-input" oninput="handleInput(event);" />
    </div>
    <div id="settings">
      <div>
        Traditional | Simplified
      </div>
      <div>
        Pinyin | Zhuyin
      </div>
      <div>
        English
      </div>
    </div>
  </body>
  <script src="./src/main.js"></script>
</html>
