<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>Study Mandarin: Basic Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../src/base.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.40/jquery.csv.min.js"></script>
  </head>
  <body>
    <div id="header">
      <a id="home-link">Home</a>
      <a onclick="reset()" style="color: #666">Reset Progress</a>
    </div>
    <div id="container">
      <div id="count"></div>
      <div id="display-characters"></div>
      <div id="english"></div>
    </div>
    <div id="actions" class="no-select">
      <div class="action">
        <a id="known-button" onclick="markAsKnown()" style="color: #999">Known</a>
      </div>
      <div class="action">
        <a id="reveal-or-next-button" onclick="revealOrNext()">Reveal</a>
      </div>
      <div class="action">
        <a id="google-translate" target="_blank" style="color: #999"
          >Translate</a
        >
      </div>
    </div>
  </body>
  <script src="../../lib/papaparse.min.js"></script>
  <script src="../../src/util.js"></script>
  <script src="./main.js"></script>
</html>
